<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="memory.js"></script>
</head>

<body>
    <header>
        <h1>Memory</h1>
        <p>Mémory-se bien les cartes</p>
    </header>

    <main>
        <div>
            <button id="restart-btn" type="button">Recommencer</button>
            <button id="start-btn" type="button">Démarrer</button>
            <span id="timer">Temps : 00:00</span>
            <span id="moves">Coups : 0</span>
        </div>
        <div id="game-board" role="group" aria-label="Plateau de jeu"></div>
    </main>

    <div id="result" aria-live="polite"></div>

</body>

</html>
