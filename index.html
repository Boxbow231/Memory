<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="memory.js"></script>
</head>

<body>
    <header>
        <h1>Memory</h1>
    </header>

    <main>
        <div>
            <button id="restart-btn" aria-label="Recommencer" type="button">Recommencer</button>

        <div id="game-board" role="grid" aria-label="Plateau de jeu"></div>
    </main>

    <section>Mémory-se bien les cartes</section>

    <section id="result" aria-live="polite"></section>

</body>

</html>
